<!-- agent.conf del grupo "Windows"
     Panel: Server management > Groups > Windows > Files > agent.conf -->
<agent_config os="Windows">

  <!-- Eventos de Sysmon desde el visor de eventos de Windows -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
