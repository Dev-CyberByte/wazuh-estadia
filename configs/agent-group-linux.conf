<!-- agent.conf del grupo "Linux"
     Panel: Server management > Groups > Linux > Files > agent.conf -->
<agent_config os="Linux">

  <!-- FIM en tiempo real (ajusta las rutas a las tuyas) -->
  <syscheck>
    <directories realtime="yes">/home/*,/root</directories>
  </syscheck>

  <!-- Eventos de auditd -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

</agent_config>
